[project]
name = "neuralmeter"
version = "0.1.0"
description = "NeuralMeter: HUD local de uso de limites de IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
    "websockets>=17.4",
]

[project.scripts]
neuralmeter = "neuralmeter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralmeter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf'"
markers = ["perf: medicao de desempenho (lenta; rode com -m perf)"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
